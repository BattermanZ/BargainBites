services:
  bargainbites:
    # Set APP_IMAGE to the image you built, e.g. bargainbites:latest
    image: ${APP_IMAGE:?set APP_IMAGE to the image to run}
    container_name: bargainbites
    restart: unless-stopped
    user: "65532:65532"
    env_file: .env
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./db:/app/database
      - ./logs:/app/logs
